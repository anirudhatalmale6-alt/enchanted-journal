<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>The Journey to Me — 21 Day Self-Transformation Journal</title>
<meta name="description" content="The Journey to Me: a 21 day self-transformation journal you can write in, keep, and carry with you.">
<meta name="theme-color" content="#a8d2f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journey to Me">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
/* Catch a password-reset link that landed on the wrong page.

   Supabase sends people back to the address in `redirect_to`, but ONLY if that
   address is on its allow-list — otherwise it quietly falls back to the
   project's Site URL, with no error anywhere. If that Site URL is the root of
   this site, a reset token arrives here, on the storybook version, which knows
   nothing about accounts, and the reader is simply stuck.

   So: if a recovery token turns up here, hand it on to the journal that can use
   it, fragment intact. Runs before anything else on the page, and does nothing
   at all in the normal case. */
(function () {
  var h = location.hash || '';
  var recovery = h.indexOf('access_token=') !== -1 && h.indexOf('type=recovery') !== -1;
  var failed   = h.indexOf('error_description=') !== -1 || h.indexOf('error=') !== -1;
  if (recovery || failed) {
    location.replace('./3d/' + h);
  }
})();
</script>
</head>
<body>

<div class="room" aria-hidden="true">
  <div class="sky"></div>
  <div class="sun-glow"></div>
  <div class="cloud-far"></div>
  <div class="cloud-near"></div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">The Journey to Me</div>
  <div class="tools">
    <span id="saveState" class="save-state" role="status" aria-live="polite">Saved</span>
    <button id="installBtn" class="tool-btn install" type="button" hidden>⤓ Install</button>
    <button id="fxToggle" class="tool-btn" type="button" title="Petals and stardust">✦ Magic: On</button>
    <button id="soundToggle" class="tool-btn" type="button" title="Page-turn sound">♪ Sound: Off</button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="book-shadow" id="bookShadow" aria-hidden="true"></div>
  <div class="book" id="book">
    <div class="static-page static-left" aria-hidden="true"></div>
    <div class="static-page static-right" aria-hidden="true"></div>
    <div class="gutter" aria-hidden="true"></div>
    <!-- leaves injected by journal.js -->
  </div>
</main>

<nav class="tabs" id="tabs" aria-label="Journal pages"></nav>

<div class="controls">
  <button id="prevBtn" class="nav-btn" type="button" aria-label="Previous page">‹</button>
  <span id="pageLabel" class="page-label">Cover</span>
  <button id="nextBtn" class="nav-btn" type="button" aria-label="Next page">›</button>
</div>

<p class="hint" id="hint">Click the page to turn it — click onto the lines to start writing</p>

<div class="sheet" id="installSheet" hidden>
  <div class="sheet-card">
    <h3>Keep this journal on your device</h3>
    <p id="installBody"></p>
    <button class="ink-btn" type="button" id="installClose">Close</button>
  </div>
</div>

<script src="content.js"></script>
<script src="journal.js"></script>
</body>
</html>
