<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Journey to Me — by candlelight</title>
<meta name="theme-color" content="#0a0406">
<meta name="description" content="The Journey to Me — a 21 day self-transformation journal, on the table by candlelight.">
<link rel="icon" href="../assets/icon-192.png">
<style>
  /* The journal is written in by hand, so the writing has to be a hand.  The
     old stack leaned on Snell Roundhand and Bradley Hand, which exist on a Mac
     and almost nowhere else — everyone else got a serif. */
  @font-face {
    font-family: 'Caveat';
    src: url('assets/caveat.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root { --gold:#d9ac62; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0a0406; overflow: hidden; }
  body {
    font: 15px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color: #e8cfa4;
    -webkit-tap-highlight-color: transparent;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* Everything fades up together once the cover art and the wood are in. */
  #ui, #view { opacity: 0; transition: opacity 1.2s ease; }
  body.loaded #view { opacity: 1; }
  body.loaded #ui { opacity: 1; transition-delay: .5s; }

  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
    text-align: center; background: #0a0406; z-index: 9;
    transition: opacity .9s ease; pointer-events: none;
  }
  body.loaded #boot { opacity: 0; }
  #boot h1 { margin: 0; font: 400 30px/1.2 Didot,"Bodoni MT",Georgia,serif; color: var(--gold); letter-spacing: .02em; }
  #boot p  { margin: 0; color: #8a6b4c; letter-spacing: .22em; text-transform: uppercase; font-size: 11px; }

  #ui { position: fixed; inset: 0; pointer-events: none; }

  #hint {
    position: absolute; left: 50%; bottom: 8.5vh; transform: translateX(-50%);
    letter-spacing: .2em; text-transform: uppercase; font-size: 11px;
    color: #c49a63; text-shadow: 0 0 18px rgba(0,0,0,.9);
    animation: breathe 3.4s ease-in-out infinite;
    transition: opacity .6s ease; white-space: nowrap;
  }
  #hint.gone { opacity: 0; animation: none; }
  @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: .95 } }

  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 54px; height: 54px; border-radius: 50%;
    border: 1px solid rgba(217,172,98,.28);
    background: rgba(20,8,10,.42); backdrop-filter: blur(3px);
    color: var(--gold); font-size: 20px; line-height: 52px; text-align: center;
    cursor: pointer; pointer-events: auto; user-select: none;
    transition: background .2s, border-color .2s, transform .2s;
  }
  .arrow:hover { background: rgba(60,20,24,.6); border-color: rgba(217,172,98,.6); }
  .arrow:active { transform: translateY(-50%) scale(.94); }
  #prev { left: max(16px, 2.5vw); }
  #next { right: max(16px, 2.5vw); }

  #tips {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 8px 18px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(200,158,110,.42);
    flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px);
    text-align: center;
  }
  body.writing #tips b { color: var(--gold); }
  #sideways { display: none; }
  body.portrait #sideways { display: inline; color: var(--gold); }

  /* Where the keystrokes actually land.  It is never seen — the letters are
     painted onto the page in the scene — but it has to be a real field so a
     phone will put its keyboard up. */
  #keys {
    position: fixed; left: -2000px; top: 0; width: 10px; height: 10px;
    opacity: 0; border: 0; resize: none;
  }

  @media (max-width: 720px) {
    /* Sitting either side of the middle, the arrows land right on top of the
       pages you are trying to read.  Down at the foot they are out of the way
       and still under a thumb. */
    .arrow {
      width: 48px; height: 48px; line-height: 46px; font-size: 18px;
      top: auto; bottom: 52px; transform: none;
    }
    .arrow:active { transform: scale(.94); }
    #prev { left: 20px; }
    #next { right: 20px; }
    /* Clear of the arrows, which have moved down to the foot of the screen. */
    #tips { font-size: 9.5px; gap: 6px 14px; bottom: 112px; max-width: calc(100vw - 40px); }
    #hint { font-size: 10px; bottom: 15vh; }
  }
</style>
</head>
<body>

<canvas id="view"></canvas>

<div id="boot">
  <h1>The Journey to Me</h1>
  <p>lighting the candle</p>
</div>

<div id="ui">
  <div id="hint">click the book to open it</div>
  <div class="arrow" id="prev" title="Back a page">‹</div>
  <div class="arrow" id="next" title="On a page">›</div>
  <div id="tips">
    <span>drag to look around</span>
    <span><b>click a page to write on it</b></span>
    <span>arrow keys to turn</span>
    <span id="sideways">turn your phone sideways for the full spread</span>
  </div>
</div>

<textarea id="keys" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></textarea>

<script src="../content.js"></script>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module" src="./scene.js"></script>
</body>
</html>
