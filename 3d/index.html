<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Journey to Me — the 3D journal</title>
<meta name="theme-color" content="#0a0406">
<meta name="description" content="The Journey to Me — a 21 day self-transformation journal, as a real book you can open and write in.">
<link rel="icon" href="../assets/icon-192.png">
<style>
  /* The journal is written in by hand, so the writing has to be a hand.  The
     old stack leaned on Snell Roundhand and Bradley Hand, which exist on a Mac
     and almost nowhere else — everyone else got a serif. */
  @font-face {
    font-family: 'Caveat';
    src: url('assets/caveat.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root { --gold:#d9ac62; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0a0406; overflow: hidden; }
  body {
    font: 15px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color: #e8cfa4;
    -webkit-tap-highlight-color: transparent;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* Everything fades up together once the cover art and the wood are in. */
  #ui, #view { opacity: 0; transition: opacity 1.2s ease; }
  body.loaded #view { opacity: 1; }
  body.loaded #ui { opacity: 1; transition-delay: .5s; }

  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
    text-align: center; background: #0a0406; z-index: 9;
    transition: opacity .9s ease; pointer-events: none;
  }
  body.loaded #boot { opacity: 0; }
  #boot h1 { margin: 0; font: 400 30px/1.2 Didot,"Bodoni MT",Georgia,serif; color: var(--gold); letter-spacing: .02em; }
  #boot p  { margin: 0; color: #8a6b4c; letter-spacing: .22em; text-transform: uppercase; font-size: 11px; }

  #ui { position: fixed; inset: 0; pointer-events: none; }

  #hint {
    position: absolute; left: 50%; bottom: 8.5vh; transform: translateX(-50%);
    letter-spacing: .2em; text-transform: uppercase; font-size: 11px;
    color: #c49a63; text-shadow: 0 0 18px rgba(0,0,0,.9);
    animation: breathe 3.4s ease-in-out infinite;
    transition: opacity .6s ease; white-space: nowrap;
  }
  #hint.gone { opacity: 0; animation: none; }
  @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: .95 } }

  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 54px; height: 54px; border-radius: 50%;
    border: 1px solid rgba(217,172,98,.28);
    background: rgba(20,8,10,.42); backdrop-filter: blur(3px);
    color: var(--gold); font-size: 20px; line-height: 52px; text-align: center;
    cursor: pointer; pointer-events: auto; user-select: none;
    transition: background .2s, border-color .2s, transform .2s;
  }
  .arrow:hover { background: rgba(60,20,24,.6); border-color: rgba(217,172,98,.6); }
  .arrow:active { transform: translateY(-50%) scale(.94); }
  #prev { left: max(16px, 2.5vw); }
  #next { right: max(16px, 2.5vw); }

  #tips {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 8px 18px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(200,158,110,.42);
    flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px);
    text-align: center;
  }
  body.writing #tips b { color: var(--gold); }
  #sideways { display: none; }
  body.portrait #sideways { display: inline; color: var(--gold); }

  /* ---- numbered day tabs, carried over from the storybook version ---- */
  #tabs {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    z-index: 6; display: flex; flex-direction: column; gap: 3px;
    padding: .5rem .45rem .5rem .2rem;
    max-height: 74vh; overflow-y: auto; scrollbar-width: none;
    pointer-events: auto;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    font: 12.5px/1 "Iowan Old Style",Palatino,Georgia,serif;
    min-width: 34px; height: 25px;
    display: flex; align-items: center; justify-content: center;
    color: #4a3018;
    background: linear-gradient(to left, #e3c99f, #f6e6c8);
    border: 1px solid rgba(120,84,36,.45); border-right: none;
    border-radius: 5px 0 0 5px;
    cursor: pointer; flex: 0 0 auto;
    box-shadow: -3px 2px 8px rgba(0,0,0,.35);
    transform: translateX(9px);
    transition: transform .22s cubic-bezier(.3,1.4,.5,1), background .25s, min-width .22s;
  }
  .tab:hover { transform: translateX(0); background: linear-gradient(to left,#fff3dd,#fffdf6); }
  .tab.active {
    transform: translateX(-2px); min-width: 42px;
    background: linear-gradient(to left, #cfa055, #f7e2ab);
    color: #3b2409; border-color: rgba(90,60,18,.7);
  }

  /* ---- the scene switch ---- */
  #modes {
    position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px;
    z-index: 6; display: flex; gap: 6px; pointer-events: auto;
  }
  .mode {
    font: 11px/1 "Iowan Old Style",Palatino,Georgia,serif;
    letter-spacing: .14em; text-transform: uppercase;
    padding: .5rem .8rem; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(217,172,98,.32);
    background: rgba(20,8,10,.42); color: #d9ac62;
    backdrop-filter: blur(3px);
    transition: background .25s, color .25s, border-color .25s;
  }
  .mode:hover { border-color: rgba(217,172,98,.7); }
  .mode.on { background: rgba(217,172,98,.9); color: #2a1608; border-color: transparent; }

  /* In daylight the dark chrome disappears against a bright sky. */
  body.day .mode { background: rgba(255,255,255,.55); color: #24455f; border-color: rgba(255,255,255,.85); }
  body.day .mode.on { background: #24455f; color: #fff; border-color: transparent; }
  body.day .arrow { background: rgba(255,255,255,.55); border-color: rgba(255,255,255,.9); color: #24455f; }
  body.day .arrow:hover { background: #fff; }
  body.day #tips { color: rgba(30,66,94,.62); }
  body.day #tips b { color: #123f60; }
  body.day #hint { color: #1e455f; text-shadow: 0 0 16px rgba(255,255,255,.9); }
  body.day #boot { background: #a8d2f5; }
  body.day #boot h1 { color: #1b3e5c; }
  body.day #boot p { color: #46708f; }

  /* ---- sign in ----
     Only ever shown when config.js has been filled in. With no account set up
     the journal behaves as it always has and none of this appears. */
  #auth {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 1.5rem;
    background: radial-gradient(120% 90% at 50% 20%, #2a1008 0%, #0a0406 70%);
  }
  #auth[hidden] { display: none; }
  body.day #auth { background: linear-gradient(to bottom, #76b0e8 0%, #a8d2f5 60%, #b0d6f4 100%); }

  #authCard {
    width: min(23rem, 100%); text-align: center;
    display: flex; flex-direction: column; gap: .85rem;
  }
  #authCard h1 {
    margin: 0; font: 400 30px/1.2 Didot,"Bodoni MT",Georgia,serif;
    color: var(--gold); letter-spacing: .02em;
  }
  body.day #authCard h1 { color: #1b3e5c; }
  #authLead { margin: 0 0 .4rem; font-size: 13px; color: #a98a63; line-height: 1.55; }
  body.day #authLead { color: #2c5170; }
  #authForm { display: flex; flex-direction: column; gap: .55rem; }
  #auth input {
    font: 15px/1.4 inherit; color: #f0e2c8;
    background: rgba(255,240,214,.06);
    border: 1px solid rgba(217,172,98,.34);
    border-radius: 7px; padding: .68rem .8rem; outline: none;
  }
  #auth input:focus { border-color: rgba(217,172,98,.85); background: rgba(255,240,214,.11); }
  body.day #auth input { color: #17364d; background: rgba(255,255,255,.72); border-color: rgba(255,255,255,.9); }
  #authGo {
    font: 12px/1 inherit; letter-spacing: .18em; text-transform: uppercase;
    padding: .8rem; margin-top: .25rem; cursor: pointer;
    border: 0; border-radius: 999px;
    background: linear-gradient(to bottom, #e7c489, #cfa055); color: #2a1608;
  }
  #authGo:disabled { opacity: .5; cursor: default; }
  #authMsg { margin: 0; font-size: 12.5px; line-height: 1.5; min-height: 1.2em; color: #e08e7a; }
  #authMsg.ok { color: #9fc48a; }
  body.day #authMsg { color: #9c3722; }
  body.day #authMsg.ok { color: #1f6b3a; }
  .authLink {
    background: none; border: 0; cursor: pointer; padding: .2rem;
    font: 12px/1.5 inherit; letter-spacing: .1em; text-transform: uppercase;
    color: #a98a63; text-decoration: underline; text-underline-offset: 3px;
  }
  .authLink:hover { color: var(--gold); }
  body.day .authLink { color: #2c5170; }
  body.day .authLink:hover { color: #0e3b5c; }

  #account {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px;
    z-index: 6; display: flex; align-items: center; gap: .6rem;
    pointer-events: auto; font-size: 11px; letter-spacing: .1em;
    color: #a98a63; max-width: 40vw;
  }
  #account[hidden] { display: none; }
  #accountWho { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.day #account { color: #2c5170; }

  /* Where the keystrokes actually land.  It is never seen — the letters are
     painted onto the page in the scene — but it has to be a real field so a
     phone will put its keyboard up. */
  #keys {
    position: fixed; left: -2000px; top: 0; width: 10px; height: 10px;
    opacity: 0; border: 0; resize: none;
  }

  @media (max-width: 720px) {
    /* Sitting either side of the middle, the arrows land right on top of the
       pages you are trying to read.  Down at the foot they are out of the way
       and still under a thumb. */
    .arrow {
      width: 48px; height: 48px; line-height: 46px; font-size: 18px;
      top: auto; bottom: 52px; transform: none;
    }
    .arrow:active { transform: scale(.94); }
    #prev { left: 20px; }
    #next { right: 20px; }
    /* Clear of the arrows, which have moved down to the foot of the screen. */
    #tips { font-size: 9.5px; gap: 6px 14px; bottom: 112px; max-width: calc(100vw - 40px); }
    #hint { font-size: 10px; bottom: 15vh; }
    /* On a phone the tabs would run down the middle of the page. They lie
       along the TOP instead: the foot of the screen already carries the tips,
       which wrap to three lines in portrait and ran straight through them. */
    #tabs {
      top: 54px; bottom: auto; right: auto; left: 50%;
      transform: translateX(-50%);
      flex-direction: row; max-width: calc(100vw - 24px); max-height: none;
      overflow-x: auto; overflow-y: hidden; padding: .3rem .4rem;
    }
    .tab {
      transform: translateY(-6px); min-width: 28px;
      border: 1px solid rgba(120,84,36,.45); border-top: none;
      border-radius: 0 0 5px 5px;
      background: linear-gradient(to bottom, #e3c99f, #f6e6c8);
      box-shadow: 0 3px 8px rgba(0,0,0,.35);
    }
    .tab.active { transform: translateY(1px); min-width: 34px;
      background: linear-gradient(to bottom, #cfa055, #f7e2ab); }
    #modes { top: 10px; right: 10px; }
    .mode { font-size: 10px; padding: .42rem .62rem; }
  }
</style>
</head>
<body>

<canvas id="view"></canvas>

<div id="boot">
  <h1>The Journey to Me</h1>
  <p id="bootLine">lighting the candle</p>
</div>

<div id="ui">
  <div id="hint">click the book to open it</div>
  <div class="arrow" id="prev" title="Back a page">‹</div>
  <div class="arrow" id="next" title="On a page">›</div>
  <div id="modes">
    <button class="mode" id="modeCandle" type="button">Candlelight</button>
    <button class="mode" id="modeDay" type="button">Daylight sky</button>
  </div>
  <div id="account" hidden>
    <span id="accountWho"></span>
    <button class="authLink" id="accountOut" type="button">Sign out</button>
  </div>
  <div id="tabs"></div>
  <div id="tips">
    <span>drag to turn the book</span>
    <span><b>click a page to write on it</b></span>
    <span>arrow keys to turn</span>
    <span id="sideways">turn your phone sideways for the full spread</span>
  </div>
</div>

<div id="auth" hidden>
  <div id="authCard">
    <h1>The Journey to Me</h1>
    <p id="authLead">Sign in, and your journal is yours on any device you open it on.</p>
    <form id="authForm" autocomplete="on">
      <input id="authEmail" type="email" name="email" autocomplete="email"
             placeholder="your email" required>
      <input id="authPass" type="password" name="password" autocomplete="current-password"
             placeholder="password" minlength="6" required>
      <button id="authGo" type="submit">Sign in</button>
    </form>
    <p id="authMsg"></p>
    <button class="authLink" id="authSwap" type="button">Create an account instead</button>
    <button class="authLink" id="authSkip" type="button">Just use this device</button>
  </div>
</div>

<textarea id="keys" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></textarea>

<script src="../content.js"></script>
<script src="./config.js"></script>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module" src="./scene.js"></script>
</body>
</html>
